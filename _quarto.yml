project:
  type: website
  output-dir: _site
  # Built demos are plain static files: copy them into the site as they are.
  resources:
    - demos/**
  render:
    - "*.qmd"
    - "projects/*/index.qmd"
    - "!projects/_template/"

website:
  title: "My Portfolio"
  favicon: images/favicon.png
  description: "A brief showcase of my side projects"
  site-url: "https://lorcanob.github.io/portfolio/"
  repo-url: "https://github.com/lorcanob/portfolio"
  open-graph: true
  page-navigation: false
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: "https://github.com/lorcanob"
        aria-label: GitHub
  page-footer:
    center: "© 2026, Lorcan Odufuwa-Bolger"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  # Pages are static for now; if code cells are added, CI reuses the results in _freeze/.
  freeze: auto
